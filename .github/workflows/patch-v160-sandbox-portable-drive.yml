name: Patch portable-drive Codex sandbox

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-v160-sandbox-portable-drive.ps1'
      - '.github/workflows/patch-v160-sandbox-portable-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply migration
        shell: pwsh
        run: |
          & ./.github/scripts/patch-v160-sandbox-portable-drive.ps1
          git diff --check
          $changed=@(git diff --name-only)
          $allowed=@('system/Start-Agent.ps1','system/VERSION.txt')
          foreach($f in $changed){if($f -notin $allowed){throw "Unexpected changed file: $f"}}
          foreach($f in $allowed){if($f -notin $changed){throw "Expected changed file missing: $f"}}

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/Start-Agent.ps1 system/VERSION.txt
          git commit -m 'Fix Codex sandbox on portable drives'
          git push origin HEAD:main
