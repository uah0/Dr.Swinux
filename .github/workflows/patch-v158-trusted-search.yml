name: Patch v1.5.58 trusted search
on:
  push:
    paths:
      - '.github/scripts/patch-v158-trusted-search.ps1'
      - '.github/workflows/patch-v158-trusted-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply migration
        shell: pwsh
        run: ./.github/scripts/patch-v158-trusted-search.ps1
      - name: Audit and commit
        shell: pwsh
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/Privileged-Broker.ps1 system/VERSION.txt
          git diff --cached --quiet && throw 'Migration produced no changes.'
          git commit -m 'Fix normalized trusted package search for v1.5.58'
          git push
