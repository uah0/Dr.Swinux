name: Patch v1.5.61 path containment

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-v161-path-containment.ps1'
      - '.github/workflows/patch-v161-path-containment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply migration
        shell: pwsh
        run: |
          & ./.github/scripts/patch-v161-path-containment.ps1
          git diff --check -- system/Start-Agent.ps1 system/VERSION.txt
          $changed=@(git diff --name-only -- system/Start-Agent.ps1 system/VERSION.txt)
          foreach($f in @('system/Start-Agent.ps1','system/VERSION.txt')){if($f -notin $changed){throw "Expected changed file missing: $f"}}

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- system/Start-Agent.ps1 system/VERSION.txt
          $staged=@(git diff --cached --name-only)
          if(($staged.Count -ne 2)-or($staged -notcontains 'system/Start-Agent.ps1')-or($staged -notcontains 'system/VERSION.txt')){throw "Unexpected staged files: $($staged -join ', ')"}
          git commit -m 'Fix sandbox path containment on portable drives'
          git push origin HEAD:main
