name: Patch v1.5.49 release audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-release-audit-v149.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Harden release audit for trusted uninstall
        shell: pwsh
        run: '& .github/scripts/patch-release-audit-v149.ps1'
