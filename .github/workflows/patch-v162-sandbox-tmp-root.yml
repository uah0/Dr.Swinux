name: Patch v1.5.62 sandbox TMP root

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-v162-sandbox-tmp-root.ps1'
      - '.github/workflows/patch-v162-sandbox-tmp-root.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply migration
        shell: pwsh
        run: |
          & ./.github/scripts/patch-v162-sandbox-tmp-root.ps1
          git diff --check -- system/Start-Agent.ps1 system/VERSION.txt
      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- system/Start-Agent.ps1 system/VERSION.txt
          $staged=@(git diff --cached --name-only)
          if(($staged.Count -ne 2)-or($staged -notcontains 'system/Start-Agent.ps1')-or($staged -notcontains 'system/VERSION.txt')){throw "Unexpected staged files: $($staged -join ', ')"}
          git commit -m 'Align Codex TMP with workspace-write sandbox'
          git push origin HEAD:main
