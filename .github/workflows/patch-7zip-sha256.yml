name: Apply pinned 7-Zip SHA256 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-7zip-sha256.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply audited SHA256 patch
        shell: pwsh
        run: '& .github/scripts/patch-7zip-sha256.ps1'
