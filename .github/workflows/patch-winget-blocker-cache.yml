name: Patch cached WinGet bootstrap blocker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-winget-blocker-cache.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch broker and version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $path='./system/Privileged-Broker.ps1'
          $text=Get-Content -LiteralPath $path -Raw -Encoding UTF8

          $anchor=@'
function Test-WingetReady {
    try {$null=Get-WingetPath;return $true}catch{return $false}
}

function Ensure-Winget {
    if(Test-WingetReady){
        $path=Get-WingetPath
        Write-BrokerLog ("WINGET_BOOTSTRAP_ALREADY_READY path={0}" -f $path)
        return [pscustomobject]@{Confirmed=$null;Changed=$false;Ready=$true;Method='AlreadyAvailable';Path=$path}
    }
'@
          $replacement=@'
function Test-WingetReady {
    try {$null=Get-WingetPath;return $true}catch{return $false}
}

function Get-WingetBootstrapBlockerPath {
    $reportsRoot=Split-Path -Parent $Session
    $stateDir=Join-Path $reportsRoot '_state'
    return (Join-Path $stateDir 'winget-bootstrap-blocker.json')
}

function Clear-WingetBootstrapBlocker {
    $path=Get-WingetBootstrapBlockerPath
    Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
}

function Set-WingetBootstrapBlocker {
    $path=Get-WingetBootstrapBlockerPath
    $dir=Split-Path -Parent $path
    New-Item -ItemType Directory -Path $dir -Force | Out-Null
    $now=[DateTimeOffset]::UtcNow
    $state=[ordered]@{
        schemaVersion=1
        code='WindowsAppRuntime1.8Missing'
        observedAt=$now.ToString('o')
        expiresAt=$now.AddHours(6).ToString('o')
    }
    $tmp=$path+'.tmp'
    $state | ConvertTo-Json -Compress | Set-Content -LiteralPath $tmp -Encoding UTF8
    Move-Item -LiteralPath $tmp -Destination $path -Force
    Write-BrokerLog ("WINGET_BOOTSTRAP_BLOCKER_CACHED code={0} expiresAt={1}" -f $state.code,$state.expiresAt)
}

function Get-WingetBootstrapBlocker {
    $path=Get-WingetBootstrapBlockerPath
    if(-not(Test-Path -LiteralPath $path -PathType Leaf)){return $null}
    try {
        $raw=Get-Content -LiteralPath $path -Raw -Encoding UTF8
        if($raw.Length -gt 4096){throw 'state file too large'}
        $state=$raw | ConvertFrom-Json -ErrorAction Stop
        if([int]$state.schemaVersion -ne 1){throw 'unexpected schema'}
        if([string]$state.code -ne 'WindowsAppRuntime1.8Missing'){throw 'unexpected blocker code'}
        $expires=[DateTimeOffset]::Parse([string]$state.expiresAt,[Globalization.CultureInfo]::InvariantCulture)
        if($expires -le [DateTimeOffset]::UtcNow){Clear-WingetBootstrapBlocker;return $null}
        return [pscustomobject]@{Code=[string]$state.code;ExpiresAt=$expires}
    } catch {
        Write-BrokerLog ("WINGET_BOOTSTRAP_BLOCKER_CACHE_INVALID error={0}" -f $_.Exception.Message)
        Clear-WingetBootstrapBlocker
        return $null
    }
}

function Ensure-Winget {
    if(Test-WingetReady){
        Clear-WingetBootstrapBlocker
        $path=Get-WingetPath
        Write-BrokerLog ("WINGET_BOOTSTRAP_ALREADY_READY path={0}" -f $path)
        return [pscustomobject]@{Confirmed=$null;Changed=$false;Ready=$true;Method='AlreadyAvailable';Path=$path}
    }
    $cachedBlocker=Get-WingetBootstrapBlocker
    if($null -ne $cachedBlocker){
        Write-BrokerLog ("WINGET_BOOTSTRAP_BLOCKER_CACHE_HIT code={0} expiresAt={1:o}" -f $cachedBlocker.Code,$cachedBlocker.ExpiresAt)
        throw ("Windows Package Manager bootstrap is temporarily skipped because Microsoft.WindowsAppRuntime.1.8 was confirmed missing earlier. Cached blocker expires at {0:o}; winget availability is still checked before using this cache." -f $cachedBlocker.ExpiresAt)
    }
'@
          if(-not $text.Contains($anchor)){throw 'Ensure-Winget anchor not found.'}
          $text=$text.Replace($anchor,$replacement)

          $anchor2=@'
        $null=Invoke-WindowsPowerShellAppx -Operation InstallBundle -BundlePath $bundle
        Write-BrokerLog 'WINGET_BOOTSTRAP_ADD_APPX_OK host=WindowsPowerShell'
    } finally {
        Remove-Item -LiteralPath $bundle -Force -ErrorAction SilentlyContinue
    }
'@
          $replacement2=@'
        $null=Invoke-WindowsPowerShellAppx -Operation InstallBundle -BundlePath $bundle
        Write-BrokerLog 'WINGET_BOOTSTRAP_ADD_APPX_OK host=WindowsPowerShell'
    } catch {
        $installError=[string]$_.Exception.Message
        if($installError -match '(?i)0x80073CF3' -and $installError -match '(?i)Microsoft\.WindowsAppRuntime\.1\.8'){
            Set-WingetBootstrapBlocker
        }
        throw
    } finally {
        Remove-Item -LiteralPath $bundle -Force -ErrorAction SilentlyContinue
    }
'@
          if(-not $text.Contains($anchor2)){throw 'InstallBundle anchor not found.'}
          $text=$text.Replace($anchor2,$replacement2)

          $anchor3=@'
    $path=Get-WingetPath
    Write-BrokerLog ("WINGET_BOOTSTRAP_READY method=OfficialMicrosoftBundle host=WindowsPowerShell version={0} path={1}" -f $package.Version,$path)
'@
          $replacement3=@'
    $path=Get-WingetPath
    Clear-WingetBootstrapBlocker
    Write-BrokerLog ("WINGET_BOOTSTRAP_READY method=OfficialMicrosoftBundle host=WindowsPowerShell version={0} path={1}" -f $package.Version,$path)
'@
          if(-not $text.Contains($anchor3)){throw 'Ready anchor not found.'}
          $text=$text.Replace($anchor3,$replacement3)
          Set-Content -LiteralPath $path -Value $text -Encoding UTF8 -NoNewline

          $version=(Get-Content ./system/VERSION.txt -Raw).Trim()
          if($version -notmatch '^Dr\.Swinux v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-final$'){throw 'Invalid version.'}
          $next='Dr.Swinux v{0}.{1}.{2}-final' -f [int]$Matches.major,[int]$Matches.minor,([int]$Matches.patch+1)
          Set-Content ./system/VERSION.txt $next -Encoding UTF8 -NoNewline
          "NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Audit and commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./system/Privileged-Broker.ps1),[ref]$null,[ref]$errors)
          if(@($errors).Count -gt 0){throw ($errors | Out-String)}
          $text=Get-Content ./system/Privileged-Broker.ps1 -Raw
          foreach($required in @('WINGET_BOOTSTRAP_BLOCKER_CACHE_HIT','WindowsAppRuntime1.8Missing','AddHours(6)','Invoke-WindowsPowerShellAppx -Operation InstallBundle')){
            if(-not $text.Contains($required)){throw "Missing expected broker invariant: $required"}
          }
          if($text -match '(?i)Invoke-Expression|\bcmd\.exe\b'){throw 'Unsafe shell execution introduced.'}
          git fetch origin main
          $remote=(git rev-parse origin/main).Trim()
          if($remote -ne $env:GITHUB_SHA){throw "main moved during migration; refusing stale commit ($env:GITHUB_SHA -> $remote)"}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/Privileged-Broker.ps1 system/VERSION.txt
          $changed=@(git diff --cached --name-only)
          if($changed.Count -ne 2 -or $changed -notcontains 'system/Privileged-Broker.ps1' -or $changed -notcontains 'system/VERSION.txt'){throw 'Unexpected migration diff.'}
          git commit -m "Cache deterministic WinGet bootstrap blocker ($env:NEXT_VERSION)"
          git push origin HEAD:main

      - name: Dispatch release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref main
