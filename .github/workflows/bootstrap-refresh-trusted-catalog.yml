name: Bootstrap trusted catalog refresh test
# One-shot dispatcher for the optimized installer-manifest-only refresh.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-refresh-trusted-catalog.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel slow run and dispatch optimized refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/uah0/Dr.Swinux/actions/runs/33776740600/cancel || true
          gh workflow run refresh-trusted-catalog.yml --repo uah0/Dr.Swinux
