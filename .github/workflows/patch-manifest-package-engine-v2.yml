name: Apply manifest-driven package engine patch v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-manifest-package-engine-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply audited manifest package engine patch
        shell: pwsh
        run: '& .github/scripts/run-manifest-package-engine-v2.ps1'
