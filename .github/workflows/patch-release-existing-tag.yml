name: Patch release publication for immutable releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-release-existing-tag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch release workflow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='.github/workflows/release.yml'
          $raw=Get-Content -LiteralPath $path -Raw
          $old='          gh release create $env:TAG $env:ASSET "$env:ASSET.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dr.Swinux $env:TAG-final" --notes "Dr.Swinux release. SHA-256: $env:SHA256" --latest'
          if(-not $raw.Contains($old)){throw 'Expected release command was not found.'}
          $new=@'
          git fetch origin --tags
          $existing=''
          try {$existing=(git rev-list -n 1 $env:TAG 2>$null).Trim()} catch {}
          if(-not [string]::IsNullOrWhiteSpace($existing)){
            if($existing -ne $env:GITHUB_SHA){throw "Release tag $env:TAG points to $existing instead of $env:GITHUB_SHA"}
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag $env:TAG $env:GITHUB_SHA
            git push origin "refs/tags/$env:TAG"
          }
          $resolved=(git rev-list -n 1 $env:TAG).Trim()
          if($resolved -ne $env:GITHUB_SHA){throw "Release tag verification failed: $resolved"}
          gh release create $env:TAG $env:ASSET "$env:ASSET.sha256" --repo $env:GITHUB_REPOSITORY --verify-tag --title "Dr.Swinux $env:TAG-final" --notes "Dr.Swinux release. SHA-256: $env:SHA256" --latest
'@
          $raw=$raw.Replace($old,$new.TrimEnd("`r","`n"))
          Set-Content -LiteralPath $path -Value $raw -Encoding utf8 -NoNewline
          git diff --check
          git diff --exit-code -- . ':(exclude).github/workflows/release.yml'
          if(-not(git diff -- .github/workflows/release.yml)){throw 'release.yml was not changed.'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml
          git commit -m 'Fix release creation for existing verified tags'
          git push origin HEAD:main
