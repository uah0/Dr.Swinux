name: Apply typed WinGet bootstrap patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-winget-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply audited source patch
        shell: pwsh
        env:
          PATCH_B64: ' '
        run: |
          $bytes=[Convert]::FromBase64String($env:PATCH_B64)
          $script=[Text.Encoding]::UTF8.GetString($bytes)
          Set-Content -LiteralPath "$env:RUNNER_TEMP\patch.ps1" -Value $script -Encoding UTF8
          & "$env:RUNNER_TEMP\patch.ps1"
