name: Apply typed WinGet bootstrap patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-winget-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply audited source patch
        shell: pwsh
        run: '& .github/scripts/patch-winget-bootstrap.ps1'
