name: Patch v1.5.64 fast start

on:
  push:
    paths:
      - '.github/scripts/patch-v164-fast-start.ps1'
      - '.github/workflows/patch-v164-fast-start.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        shell: pwsh
        run: ./.github/scripts/patch-v164-fast-start.ps1

      - name: Audit diff
        shell: pwsh
        run: |
          $targets=@('system/Start-Agent.ps1','system/VERSION.txt')
          $changed=@(git diff --name-only -- @targets)
          if($changed.Count -eq 0){ throw 'Migration produced no intended changes.' }
          foreach($path in $targets){ if($path -notin $changed){ throw "Expected changed file missing: $path" } }
          git diff --check -- system/Start-Agent.ps1 system/VERSION.txt
          $agent=Get-Content system/Start-Agent.ps1 -Raw
          if($agent -match 'danger-full-access'){throw 'Unsafe sandbox regression'}
          if($agent -notmatch 'approval_policy=\"never\"'){throw 'Approval policy invariant missing'}
          if($agent -notmatch 'windows\.sandbox=\"unelevated\"'){throw 'Unelevated sandbox invariant missing'}
          if($agent -notmatch 'READY_CACHED'){throw 'Cached runtime fast path missing'}
          if($agent -notmatch "codex-auth' -Status 'FAST_PATH"){throw 'Auth fast path missing'}
          if($agent -match '\$timer=Start-LargeTaskTimer'){throw 'Delayed timer start remains'}
          git diff -- system/Start-Agent.ps1 system/VERSION.txt

      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/Start-Agent.ps1 system/VERSION.txt
          git commit -m 'Reduce task startup latency and show timer immediately'
          git push origin HEAD:main
