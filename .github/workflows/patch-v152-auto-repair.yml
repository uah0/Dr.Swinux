name: Apply v1.5.52 auto-repair pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v152-auto-repair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply audited auto-repair integration
        shell: pwsh
        run: '& .github/scripts/patch-v152-auto-repair.ps1'
