name: Audit v1.5.66 runtime diagnostic cleanup

on:
  push:
    branches:
      - 'audit/v1.5.66-runtime-diag-cleanup'
    paths:
      - '.github/scripts/patch-v166-runtime-diag-cleanup.py'
      - '.github/workflows/audit-v166-runtime-diag-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate migration
        shell: bash
        run: python3 .github/scripts/patch-v166-runtime-diag-cleanup.py

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($ps in @(
            'system/Start-Agent.ps1',
            'system/Privileged-Broker.ps1',
            'system/Broker-Request.ps1',
            'system/Diagnostic-Tool.ps1',
            'system/Setup-PortableCodex.ps1'
          )){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $ps),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ throw ("PowerShell parse error in {0}: {1}" -f $ps,(($errors | ForEach-Object {$_.Message}) -join '; ')) }
          }

      - name: Audit security and performance invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $agent=Get-Content system/Start-Agent.ps1 -Raw
          $broker=Get-Content system/Privileged-Broker.ps1 -Raw
          if((Get-Content system/VERSION.txt -Raw).Trim() -ne 'Dr.Swinux v1.5.66-final'){ throw 'VERSION mismatch.' }
          if($agent -match 'danger-full-access'){ throw 'danger-full-access is forbidden.' }
          if($agent -notmatch 'windows\.sandbox=\\?"unelevated\\?"'){ throw 'unelevated sandbox invariant missing.' }
          if($agent -notmatch 'approval_policy=\\?"never\\?"'){ throw 'approval never invariant missing.' }
          if($agent -match '&\s*\$codex\s+--version'){ throw 'Normal Start-Agent path still launches codex --version.' }
          if($agent -notmatch 'READY_FAST'){ throw 'Fast runtime validation marker missing.' }
          if($agent -notmatch 'Remove-SessionRuntimePathWithRetry'){ throw 'Retry cleanup helper missing.' }
          if($agent -notmatch 'Attempts=16'){ throw 'Bounded cleanup retry policy missing.' }
          if($broker -notmatch 'ACTIVATION_RESULT source=SoftwareProtectionPlatformRegistry activated=True fastPath=True'){ throw 'Activation registry fast path missing.' }
          $regPos=$broker.IndexOf("if(`$activationResult -eq 0)")
          $cimPos=$broker.IndexOf('Get-CimInstance SoftwareLicensingProduct')
          if($regPos -lt 0 -or $cimPos -lt 0 -or $regPos -gt $cimPos){ throw 'Activation CIM is not a fallback after registry fast path.' }
          foreach($action in @('GetWindowsActivationStatus','GetRegistryRead')){ if($broker -notmatch [regex]::Escape($action)){ throw "Broker read action missing: $action" } }

      - name: Stage and audit exact candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git add system/Start-Agent.ps1 system/Privileged-Broker.ps1 system/VERSION.txt
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          expected=(system/Privileged-Broker.ps1 system/Start-Agent.ps1 system/VERSION.txt)
          [[ ${#changed[@]} -eq 3 ]] || { echo "Expected exactly 3 staged source files"; exit 1; }
          for i in 0 1 2; do [[ "${changed[$i]}" == "${expected[$i]}" ]] || { echo "Unexpected staged file order/set"; exit 1; }; done

      - name: Commit audited candidate to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Candidate v1.5.66 runtime diagnostics cleanup"
          git push origin HEAD:audit/v1.5.66-runtime-diag-cleanup
