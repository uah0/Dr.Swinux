name: Build and publish Dr.Swinux

on:
  push:
    branches: [main]
    paths:
      - 'system/VERSION.txt'
      - '.github/workflows/release.yml'
      - 'system/assets/branding/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dr-swinux-release
  cancel-in-progress: false
jobs:
  audit-build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Audit source and resolve version
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version Latest
          $versionLine=(Get-Content 'system/VERSION.txt' -Raw).Trim(); if($versionLine -notmatch '^Dr\.Swinux v(?<version>\d+\.\d+\.\d+)-final$'){throw "Invalid VERSION: $versionLine"}; $version=$Matches.version; "version=$version" >> $env:GITHUB_OUTPUT; "tag=v$version" >> $env:GITHUB_OUTPUT; $asset="Dr.Swinux-v$version-final.zip"; "asset=$asset" >> $env:GITHUB_OUTPUT
          foreach($p in @('README.md','system/ASK-AGENT.cmd','system/LAB-SWINUX.cmd','system/Lab-Loop.ps1','system/Audit-LabCandidate.ps1','system/Start-DoctorSwinux.ps1','system/Start-Agent.ps1','system/Update-DrSwintus.ps1','system/Privileged-Broker.ps1','system/Create-Shortcut.ps1','system/core/ARCHITECTURE.md','system/core/Get-PlatformManifest.ps1','system/platform/windows/manifest.json','system/platform/linux/manifest.json','system/platform/android/manifest.json','system/assets/branding/dr-swinux.png','system/assets/branding/dr-swinux-icon.png')){if(-not(Test-Path $p -PathType Leaf)){throw "Missing: $p"}}
          $parseErrors=@(); Get-ChildItem system -Recurse -Filter '*.ps1'|%{$t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e);if($e){$parseErrors+=$e}};if($parseErrors){$parseErrors|%{Write-Error $_};throw 'PowerShell parser audit failed'}
          $allText=(Get-ChildItem system -Recurse -File -Include '*.ps1','*.cmd'|%{Get-Content $_.FullName -Raw}) -join "`n"; if($allText-match'=\s*try\s*\{'){throw 'Regression: assignment to try'};if($allText-match'\$(?!env:|global:|script:|local:|private:|using:)[A-Za-z_][A-Za-z0-9_]*:'){throw 'Regression: interpolated variable-colon'};if($allText-match'-RootPath\s+"%ROOT%"'){throw 'Regression: CMD RootPath forwarding'};if($allText-match'-UsbRoot\s+"%USBROOT%"'){throw 'Regression: CMD UsbRoot forwarding'};if($allText-match'danger-full-access'){throw 'Unsafe Codex sandbox'};if($allText-notmatch'approval_policy="never"'){throw 'Missing approval policy'};if($allText-notmatch'windows\.sandbox="unelevated"'){throw 'Missing unelevated sandbox'};if($allText-notmatch'workspace-write'){throw 'Missing workspace-write'}
          $up=Get-Content 'system/Update-DrSwintus.ps1' -Raw;if($up-notmatch'uah0/Dr\.Swinux'){throw 'Updater repo mismatch'};if($up-notmatch'asset\.digest'){throw 'Updater digest verification missing'};if($up-notmatch'\^Dr\\\.Swinux-v'){throw 'Updater does not prefer Dr.Swinux assets'}
          $wm=Get-Content 'system/platform/windows/manifest.json' -Raw|ConvertFrom-Json;if($wm.status-ne'supported'-or$wm.product-ne'Dr.Swinux'){throw 'Windows manifest mismatch'};foreach($id in @('linux','android')){$m=Get-Content "system/platform/$id/manifest.json" -Raw|ConvertFrom-Json;if($m.status-ne'planned'){throw "$id must remain planned"}};$resolved=& 'system/core/Get-PlatformManifest.ps1' -SystemRoot 'system';if($resolved.id-ne'windows'){throw 'Windows resolver regression'}
          $readme=Get-Content README.md -Raw;if($readme-notmatch'(Dr\.Swinux\.png|system/assets/branding/dr-swinux\.png)'){throw 'README branding mismatch'};if($readme-match'doctor-swinux\.png'){throw 'Old branding reference'};if(Get-ChildItem -Recurse -File -Filter 'auth.json'){throw 'auth.json must never ship'};if(Test-Path 'RUN-DR-SWINTUS.cmd'){throw 'Removed legacy launcher returned'};if(Select-String -Path README.md,system/assets/branding/README.md -Pattern 'uah007' -Quiet){throw 'uah007 must not be listed as developer'}
      - name: Build portable ZIP
        shell: pwsh
        env: { ASSET: '${{ steps.meta.outputs.asset }}' }
        run: |
          $ErrorActionPreference='Stop';$stage=Join-Path $env:RUNNER_TEMP 'Dr.Swinux';New-Item $stage -ItemType Directory -Force|Out-Null;New-Item (Join-Path $stage reports) -ItemType Directory|Out-Null;New-Item (Join-Path $stage tools) -ItemType Directory|Out-Null;Copy-Item README.md $stage;Copy-Item system $stage -Recurse;& (Join-Path $stage 'system/Create-Shortcut.ps1');if(-not(Test-Path (Join-Path $stage 'ASK-AGENT.cmd.lnk'))){throw 'Shortcut missing'};if(-not(Test-Path (Join-Path $stage 'system/assets/branding/dr-swinux.ico'))){throw 'ICO missing'};Compress-Archive -Path $stage -DestinationPath $env:ASSET -CompressionLevel Optimal -Force;$hash=(Get-FileHash $env:ASSET -Algorithm SHA256).Hash.ToLowerInvariant();"$hash  $env:ASSET"|Set-Content "$env:ASSET.sha256" -Encoding ascii;"SHA256=$hash" >> $env:GITHUB_ENV
      - name: Verify ZIP
        shell: pwsh
        env: { ASSET: '${{ steps.meta.outputs.asset }}' }
        run: |
          $ErrorActionPreference='Stop';$v=Join-Path $env:RUNNER_TEMP verify;Expand-Archive $env:ASSET $v -Force;$r=Join-Path $v 'Dr.Swinux';foreach($p in @('README.md','ASK-AGENT.cmd.lnk','system/VERSION.txt','system/Start-DoctorSwinux.ps1','system/LAB-SWINUX.cmd','system/Lab-Loop.ps1','system/Audit-LabCandidate.ps1','system/assets/branding/dr-swinux.png','system/assets/branding/dr-swinux-icon.png','system/assets/branding/dr-swinux.ico')){if(-not(Test-Path (Join-Path $r $p))){throw "ZIP missing $p"}};if((Get-Content (Join-Path $r 'system/VERSION.txt') -Raw).Trim()-ne"Dr.Swinux v${{ steps.meta.outputs.version }}-final"){throw 'ZIP version mismatch'}
      - name: Publish GitHub Release
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ steps.meta.outputs.tag }}', ASSET: '${{ steps.meta.outputs.asset }}' }
        run: |
          gh release create $env:TAG $env:ASSET "$env:ASSET.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dr.Swinux $env:TAG-final" --notes "Dr.Swinux release. SHA-256: $env:SHA256" --latest
