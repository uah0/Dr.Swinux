name: Patch v1.5.65 diagnostic API

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-v165-diagnostic-api.py'
      - '.github/workflows/patch-v165-diagnostic-api.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 .github/scripts/patch-v165-diagnostic-api.py

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($ps in @('system/Start-Agent.ps1','system/Privileged-Broker.ps1','system/Broker-Request.ps1','system/Diagnostic-Tool.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $ps),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ throw ("PowerShell parse error in {0}: {1}" -f $ps,(($errors | ForEach-Object {$_.Message}) -join '; ')) }
          }

      - name: Audit targets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((Get-Content system/VERSION.txt -Raw).Trim() -ne 'Dr.Swinux v1.5.65-final'){ throw 'VERSION mismatch.' }
          $agent=Get-Content system/Start-Agent.ps1 -Raw
          $broker=Get-Content system/Privileged-Broker.ps1 -Raw
          $client=Get-Content system/Broker-Request.ps1 -Raw
          if($agent -match 'danger-full-access'){ throw 'danger-full-access is forbidden.' }
          if($agent -notmatch 'windows\.sandbox=\\?"unelevated\\?"'){ throw 'unelevated sandbox invariant missing.' }
          if($agent -notmatch 'approval_policy=\\?"never\\?"'){ throw 'approval never invariant missing.' }
          foreach($text in @($agent,$broker,$client)){ if($text -notmatch 'GetWindowsActivationStatus'){ throw 'activation action missing from one or more layers.' } }
          if($agent -notmatch 'diagnostic-prefetch'){ throw 'activation prefetch missing.' }
          if($agent -notmatch 'Invoke-SessionRuntimeCleanup'){ throw 'runtime cleanup missing.' }
          if(-not(Test-Path system/Diagnostic-Tool.ps1)){ throw 'Diagnostic-Tool.ps1 missing.' }
          if(-not(Test-Path tools/Diagnostics/README.txt)){ throw 'Diagnostics backend README missing.' }
          git diff --check -- system/Start-Agent.ps1 system/Privileged-Broker.ps1 system/Broker-Request.ps1 system/VERSION.txt

      - name: Stage and verify exact migration set
        shell: bash
        run: |
          set -euo pipefail
          git add system/Start-Agent.ps1 system/Privileged-Broker.ps1 system/Broker-Request.ps1 system/Diagnostic-Tool.ps1 system/VERSION.txt tools/Diagnostics/README.txt
          mapfile -t actual < <(git diff --cached --name-only | sort)
          expected=(
            system/Broker-Request.ps1
            system/Diagnostic-Tool.ps1
            system/Privileged-Broker.ps1
            system/Start-Agent.ps1
            system/VERSION.txt
            tools/Diagnostics/README.txt
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --cached --check
          git diff --cached --stat

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release v1.5.65 diagnostic API and cleanup"
          git push origin HEAD:main
