name: Refresh trusted package catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-trusted-catalog.yml'
      - 'system/tools/Build-TrustedPackageCatalog.ps1'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  actions: write
  contents: write

concurrency:
  group: trusted-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Checkout Dr.Swinux
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout WinGet installer manifests only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source="$env:RUNNER_TEMP\winget-pkgs"
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/microsoft/winget-pkgs.git $source
          Push-Location $source
          try {
            git sparse-checkout init --no-cone
            Set-Content -LiteralPath '.git/info/sparse-checkout' -Encoding ascii -Value @(
              '/manifests/'
              '!/manifests/**/*.yaml'
              '/manifests/**/*.installer.yaml'
            )
            git checkout HEAD
            $commit=(git rev-parse HEAD).Trim()
            if($commit -notmatch '^[0-9a-f]{40}$'){throw 'Could not resolve winget-pkgs commit.'}
            $count=@(Get-ChildItem manifests -Recurse -File -Filter '*.installer.yaml').Count
            if($count -lt 100){throw "Sparse checkout unexpectedly small: $count installer manifests"}
            "WINGET_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINGET_INSTALLER_MANIFESTS=$count" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally { Pop-Location }

      - name: Install pinned YAML parser
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force
          Import-Module powershell-yaml -RequiredVersion 0.4.12 -Force
          if(-not(Get-Command ConvertFrom-Yaml -ErrorAction SilentlyContinue)){throw 'Pinned YAML parser unavailable.'}

      - name: Generate and audit safe snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          Import-Module powershell-yaml -RequiredVersion 0.4.12 -Force
          $manifestRoot=Join-Path "$env:RUNNER_TEMP\winget-pkgs" 'manifests'
          $candidate=Join-Path $env:RUNNER_TEMP 'trusted-packages.candidate.json'
          & ./system/tools/Build-TrustedPackageCatalog.ps1 -WingetManifestRoot $manifestRoot -OutputPath $candidate -AutomaticSafeSubset -SourceCommit $env:WINGET_COMMIT

          $catalog=Get-Content $candidate -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
          if($catalog.schemaVersion -ne 1){throw 'Unexpected catalog schema.'}
          if([string]$catalog.source.name -ne 'microsoft/winget-pkgs'){throw 'Unexpected catalog source.'}
          if([string]$catalog.source.policy -ne 'automatic-msi-wix-productcode-mutable-url-live-hash-v2'){throw 'Unexpected catalog policy.'}
          if([string]$catalog.source.commit -ne $env:WINGET_COMMIT){throw 'Catalog source commit mismatch.'}
          if(@($catalog.packages).Count -lt 100){throw 'Generated catalog is unexpectedly small.'}

          $ids=@{}
          foreach($package in @($catalog.packages)){
            $id=[string]$package.id
            if([string]::IsNullOrWhiteSpace($id) -or $ids.ContainsKey($id.ToLowerInvariant())){throw "Invalid or duplicate package id: $id"}
            $ids[$id.ToLowerInvariant()]=$true
            foreach($installer in @($package.installers)){
              if([string]$installer.installerType -notin @('msi','wix')){throw "Unsafe installer type in automatic catalog: $id"}
              if([string]$installer.architecture -notin @('x64','x86','arm64')){throw "Unsafe architecture in automatic catalog: $id"}
              if([string]$installer.url -notmatch '^https://'){throw "Non-HTTPS URL in automatic catalog: $id"}
              if([string]$installer.sha256 -notmatch '^[A-F0-9]{64}$'){throw "Invalid SHA-256 in automatic catalog: $id"}
              if([string]::IsNullOrWhiteSpace([string]$installer.productCode)){throw "Missing ProductCode in automatic catalog: $id"}
              if(@($installer.silentArgs).Count -ne 0){throw "Automatic catalog must not carry executable argument data: $id"}
              try {[void][regex]::new([string]$installer.displayNamePattern)} catch {if(-not[string]::IsNullOrWhiteSpace([string]$installer.displayNamePattern)){throw "Invalid display regex: $id"}}
              try {[void][regex]::new([string]$installer.publisherPattern)} catch {if(-not[string]::IsNullOrWhiteSpace([string]$installer.publisherPattern)){throw "Invalid publisher regex: $id"}}
            }
          }

          $current=Get-Content ./system/catalog/trusted-packages.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $currentPackages=$current.packages | ConvertTo-Json -Depth 8 -Compress
          $candidatePackages=$catalog.packages | ConvertTo-Json -Depth 8 -Compress
          if($currentPackages -eq $candidatePackages){
            'CATALOG_CHANGED=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Trusted catalog package content is unchanged.'
            exit 0
          }
          Copy-Item $candidate ./system/catalog/trusted-packages.json -Force
          'CATALOG_CHANGED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $version=(Get-Content ./system/VERSION.txt -Raw).Trim()
          if($version -notmatch '^Dr\.Swinux v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-final$'){throw 'Invalid Dr.Swinux version.'}
          $next='Dr.Swinux v{0}.{1}.{2}-final' -f [int]$Matches.major,[int]$Matches.minor,([int]$Matches.patch+1)
          Set-Content ./system/VERSION.txt $next -Encoding UTF8 -NoNewline
          "NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit audited catalog refresh
        if: env.CATALOG_CHANGED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          $remote=(git rev-parse origin/main).Trim()
          if($remote -ne $env:GITHUB_SHA){throw "main moved during catalog generation; refusing stale automatic commit ($env:GITHUB_SHA -> $remote)"}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system/catalog/trusted-packages.json system/VERSION.txt
          $changed=@(git diff --cached --name-only)
          if($changed.Count -ne 2 -or $changed -notcontains 'system/catalog/trusted-packages.json' -or $changed -notcontains 'system/VERSION.txt'){throw 'Automatic refresh attempted to modify unexpected files.'}
          git commit -m "Refresh trusted catalog from winget-pkgs $env:WINGET_COMMIT"
          git push origin HEAD:main

      - name: Dispatch independent release audit
        if: env.CATALOG_CHANGED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref main
